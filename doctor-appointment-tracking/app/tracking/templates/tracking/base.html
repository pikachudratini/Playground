<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Appointment Tracking{% endblock %}</title>
<style>
  :root {
    --ink:#1a2233; --muted:#5b6678; --line:#dde3ec; --bg:#eef1f6;
    --card:#ffffff; --accent:#1f5fae; --good:#1f7a4d; --warn:#b07d1a; --bad:#b3261e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { background:var(--ink); color:#fff; padding:.6rem 1rem; }
  header .wrap { display:flex; flex-wrap:wrap; align-items:center; gap:1rem;
                 max-width:1100px; margin:0 auto; }
  header .brand { font-weight:700; }
  header nav { display:flex; gap:1rem; flex-wrap:wrap; }
  header nav a, header .who { color:#cdd6e4; }
  header nav a:hover { color:#fff; }
  header .spacer { margin-left:auto; }
  header form { display:inline; }
  header button.link { background:none; border:0; color:#cdd6e4; cursor:pointer;
                        font:inherit; padding:0; }
  main { max-width:1100px; margin:1.2rem auto; padding:0 1rem; }
  h1 { font-size:1.5rem; margin:.2rem 0 1rem; }
  h2 { font-size:1.15rem; margin:1.4rem 0 .6rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:1rem 1.1rem; margin-bottom:1rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.9rem; }
  .stat .n { font-size:1.7rem; font-weight:700; }
  .stat .l { color:var(--muted); font-size:.85rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line);
           font-size:.92rem; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase;
       letter-spacing:.03em; }
  .badge { display:inline-block; padding:.1rem .5rem; border-radius:999px;
           font-size:.78rem; font-weight:600; background:#e7ecf3; color:var(--ink); }
  .badge.good { background:#dff0e6; color:var(--good); }
  .badge.warn { background:#f6ecd4; color:var(--warn); }
  .badge.bad  { background:#f6dcda; color:var(--bad); }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0;
         border-radius:6px; padding:.45rem .9rem; font:inherit; cursor:pointer; }
  .btn:hover { text-decoration:none; opacity:.92; }
  .btn.sec { background:#e7ecf3; color:var(--ink); }
  .btn.small { padding:.25rem .6rem; font-size:.85rem; }
  .msg { padding:.6rem .9rem; border-radius:6px; margin-bottom:.7rem; border:1px solid var(--line); }
  .msg.success { background:#dff0e6; border-color:#bfe0cc; }
  .msg.error { background:#f6dcda; border-color:#e6bdb9; }
  label { display:block; font-weight:600; margin:.7rem 0 .2rem; font-size:.9rem; }
  input[type=text], input[type=date], input[type=number], input[type=datetime-local],
  input[type=password], select, textarea {
    width:100%; padding:.45rem; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .muted { color:var(--muted); }
  .right { text-align:right; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; }
  .pill-nav a { display:inline-block; padding:.2rem .6rem; border:1px solid var(--line);
                border-radius:999px; margin:0 .2rem .3rem 0; font-size:.85rem; }
  .pill-nav a.on { background:var(--accent); color:#fff; }
  pre.email { background:#f7f9fc; border:1px solid var(--line); border-radius:6px;
              padding:.9rem; white-space:pre-wrap; font-size:.9rem; }
</style>
</head>
<body>
{% if user.is_authenticated %}
<header><div class="wrap">
  <span class="brand">Appointment Tracking</span>
  <nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'appointments' %}">Appointments</a>
    <a href="{% url 'disputes' %}">Disputes</a>
    <a href="/admin/">Admin</a>
  </nav>
  <span class="spacer who">{{ user.get_full_name|default:user.username }}</span>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}
    <button type="submit" class="link">Log out</button>
  </form>
</div></header>
{% endif %}
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
